version: '3.8'

services:
  # 1. MySQL 数据库服务 (完全对齐 PDF 要求)
  mysql:
    image: mysql:8.0
    container_name: mysql8
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: UserPass123!
      MYSQL_DATABASE: mydb
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped

  # 2. Postgres 数据库服务 (完全对齐 PDF 要求)
  postgres:
    image: postgres:16
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: Yxxxxxx
      POSTGRES_DB: mydb
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  # 3. Redis 内存缓存服务 (使用 bitnami 镜像并完全对齐 PDF 用户名密码)
  redis:
    image: bitnami/redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    environment:
      - REDIS_USERNAME=root
      - REDIS_PASSWORD=Yoxxxxxx
    restart: unless-stopped

  # 4. Neo4j 图数据库服务 (完全对齐 PDF 的 5.18.0 版本、密码及 apoc 插件)
  neo4j:
    image: neo4j:5.18.0
    container_name: neo4j
    ports:
      - "7474:7474" # HTTP 端口
      - "7687:7687" # Bolt 协议端口
    environment:
      - NEO4J_AUTH=neo4j/12345678
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - ./neo4j/data:/data
      - ./neo4j/logs:/logs
    restart: always

  # 5. Milvus 向量数据库服务 (完全对齐 PDF 的 v2.5.7 拓扑及桥接网络)
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: milvus-etcd
    command: etcd --advertise-client-urls http://etcd:2379 --listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ./etcd/data:/etcd
    networks:
      - milvus-network
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: milvus-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # API 端口
      - "9001:9001" # 控制台端口
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - ./minio/data:/minio_data
    networks:
      - milvus-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  milvus-standalone:
    image: milvusdb/milvus:v2.5.7
    container_name: milvus-standalone
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
    ports:
      - "19530:19530" # gRPC 端口
      - "9091:9091"   # HTTP 健康检查端口
    volumes:
      - ./milvus/data:/var/lib/milvus/data
      - ./milvus/logs:/var/lib/milvus/logs
    networks:
      - milvus-network
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  # 6. Attu - Milvus 官方可视化控制台 (完全对齐 PDF 要求)
  attu:
    image: zilliz/attu:v2.5.7
    container_name: attu
    ports:
      - "8000:3000" # Web 访问端口
    environment:
      MILVUS_URL: milvus-standalone:19530
    depends_on:
      milvus-standalone:
        condition: service_healthy
    networks:
      - milvus-network
    restart: unless-stopped

networks:
  milvus-network:
    driver: bridge
    name: milvus-network

volumes:
  mysql_data:
  postgres-data:
